# Draft CI. Not pushed anywhere yet.
name: ci
on: [push, pull_request]
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: stellar CLI (rs-stellar-xdr reference decoder)
        run: |
          curl -sSfL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh -s -- --no-modify-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: schema, round-trip (Rust + JS), tx hash, semantic checks
        run: node tools/check-corpus.mjs
      - name: Go round-trip
        working-directory: runners/go
        run: go run .
  repros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: bash repros/js-stellar-sdk/run.sh
      - run: bash repros/wallet-backend/run.sh
