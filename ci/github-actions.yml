# GitHub Actions workflow. Copy to .github/workflows/ci.yml to enable it.
name: ci
on: [push, pull_request]
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: stellar CLI 30.0.1 (rs-stellar-xdr 30 reference decoder)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli-30.0.1-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/bin" stellar
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: schema, round-trip (Rust + JS), tx hash, semantic checks
        run: node tools/check-corpus.mjs
      - name: Go round-trip
        working-directory: runners/go
        run: go run .
  repros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: bash repros/js-stellar-sdk/run.sh
      - run: bash repros/wallet-backend/run.sh
