[package]
name = "xck-livecheck-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Rust reader for the xdr-cap-coverage-kit live differential checker (rs-stellar-xdr 30)"

[dependencies]
stellar-xdr = { version = "=30.0.0", default-features = false, features = ["std", "serde", "serde_json"] }
serde_json = "1"
serde = "1"

[profile.release]
debug = false
